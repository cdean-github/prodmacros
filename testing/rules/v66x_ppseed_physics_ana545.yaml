
#______________________________________________________________________________________________________________________
v666_TRKR_SEED_run3pp:
  params:
    dsttype:     DST_TRKR_SEED
    period:      run3pp
    physicsmode: physics
    dataset:     run3pp
    build:       ana.545
    dbtag:       newcdbtag
    version:     666

  input:
    intriplet:   ana532_2025p009_v001

  job:
    script:                 run_jobA.sh
    log:                   '{condor}/{logbase}.condor'
    neventsper:             1000  # MUST match neventsper used to produce the input intriplet
    payload:                [../tracking_code/*]
    request_memory:         3GB, 4GB, 6GB
    request_cpus:          '2'
    batch_name:            '{rule_name}_{dataset}_{outtriplet}'
    priority:              '30'

